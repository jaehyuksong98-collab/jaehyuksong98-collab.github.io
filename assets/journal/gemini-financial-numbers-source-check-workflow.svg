<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img"><title>From filing to approved inputs</title><rect width="640" height="620" fill="#f6f4ec"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17352f"><rect x="60" y="20" width="520" height="82" rx="8" fill="#fff" stroke="#a8b9ad"/><text x="320" y="52" font-size="23">Official filing</text><text x="320" y="80" font-size="17">Save URL, date and report version</text><path d="M320 104v17m-5 -5 5 5 5 -5" fill="none" stroke="#17352f" stroke-width="2"/><rect x="60" y="125" width="520" height="82" rx="8" fill="#fff" stroke="#a8b9ad"/><text x="320" y="157" font-size="23">Extracted rows</text><text x="320" y="185" font-size="17">Keep labels, periods, units and pages</text><path d="M320 209v17m-5 -5 5 5 5 -5" fill="none" stroke="#17352f" stroke-width="2"/><rect x="60" y="230" width="520" height="82" rx="8" fill="#fff" stroke="#a8b9ad"/><text x="320" y="262" font-size="23">Source review</text><text x="320" y="290" font-size="17">Check every value against the report</text><path d="M320 314v17m-5 -5 5 5 5 -5" fill="none" stroke="#17352f" stroke-width="2"/><rect x="60" y="335" width="520" height="82" rx="8" fill="#fff" stroke="#a8b9ad"/><text x="320" y="367" font-size="23">Excel checks</text><text x="320" y="395" font-size="17">Recalculate growth and margins</text><path d="M320 419v17m-5 -5 5 5 5 -5" fill="none" stroke="#17352f" stroke-width="2"/><rect x="60" y="440" width="520" height="82" rx="8" fill="#fff" stroke="#a8b9ad"/><text x="320" y="472" font-size="23">Approved inputs</text><text x="320" y="500" font-size="17">Record corrections before model use</text><text x="320" y="565" font-size="18">Unresolved values stay outside the model.</text><text x="320" y="594" font-size="16" fill="#64716a">Proposed workflow · No measured results</text></g></svg>