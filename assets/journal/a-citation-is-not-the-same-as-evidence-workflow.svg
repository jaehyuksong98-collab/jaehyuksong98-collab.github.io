<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc"><title id="title">From a claim to an approved input</title><desc id="desc">A proposed learning workflow. All classifications receive human review. Unresolved claims remain outside the model.</desc><rect width="640" height="620" fill="#f5f3ea"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#203b46" stroke-width="1.6"/></marker></defs><g font-family="Arial,sans-serif" fill="#203b46"><text x="32" y="42" font-size="16" letter-spacing="2">PROPOSED REVIEW PROCESS</text><rect x="32" y="72" width="576" height="106" rx="4" fill="#fffdf6" stroke="#b6c0bc"/><text x="52" y="96" font-size="13" letter-spacing="1.5">01 / PAIR</text><text x="52" y="125" font-size="21">Claim + exact source passage</text><text x="52" y="152" font-size="16">Keep page, period and units.</text><path d="M320 181V200" stroke="#203b46" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="206" width="576" height="106" rx="4" fill="#fffdf6" stroke="#b6c0bc"/><text x="52" y="230" font-size="13" letter-spacing="1.5">02 / ASSESS</text><text x="52" y="259" font-size="21">What does the passage establish?</text><text x="52" y="286" font-size="16">Supported / contradicted / insufficient evidence</text><path d="M320 315V334" stroke="#203b46" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="340" width="576" height="106" rx="4" fill="#fffdf6" stroke="#b6c0bc"/><text x="52" y="364" font-size="13" letter-spacing="1.5">03 / REVIEW</text><text x="52" y="393" font-size="21">Read the source. Check the calculation.</text><text x="52" y="420" font-size="16">Human review + separate Excel checks</text><path d="M320 449V468" stroke="#203b46" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="474" width="576" height="106" rx="4" fill="#fffdf6" stroke="#b6c0bc"/><text x="52" y="498" font-size="13" letter-spacing="1.5">04 / DECIDE</text><text x="52" y="527" font-size="21">Approve the input or hold it back.</text><text x="52" y="554" font-size="16">Unresolved claims stay outside the model.</text></g></svg>