<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="title"><title id="title">Proposed learning workflow</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#35574c"/></marker></defs><rect width="640" height="620" fill="#efeee7"/><rect x="24" y="25" width="592" height="110" rx="12" fill="#fff" stroke="#a1b4a7"/><text x="52" y="65" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#173044">SEPARATE RECORDS</text><text x="52" y="102" font-family="Arial,sans-serif" font-size="18" fill="#43564d">Orders, costs and cash receipts</text><path d="M320 141V167" stroke="#35574c" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="175" width="592" height="110" rx="12" fill="#fff" stroke="#a1b4a7"/><text x="52" y="215" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#173044">DEFINE AND RECONCILE</text><text x="52" y="252" font-family="Arial,sans-serif" font-size="18" fill="#43564d">Match periods, units and exceptions</text><path d="M320 291V317" stroke="#35574c" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="325" width="592" height="110" rx="12" fill="#fff" stroke="#a1b4a7"/><text x="52" y="365" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#173044">DRAFT EXPLANATION</text><text x="52" y="402" font-family="Arial,sans-serif" font-size="18" fill="#43564d">Ask what changed and what is missing</text><path d="M320 441V467" stroke="#35574c" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="475" width="592" height="110" rx="12" fill="#fff" stroke="#a1b4a7"/><text x="52" y="515" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#173044">HUMAN CONCLUSION</text><text x="52" y="552" font-family="Arial,sans-serif" font-size="18" fill="#43564d">Resolve differences before sharing</text></svg>